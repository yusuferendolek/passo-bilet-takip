name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  # Her gün Passo API'sinin hâlâ aynı biçimde yanıt verdiğini kontrol et
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  test:
    name: Birim testleri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  live:
    name: Canlı Passo API testi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:live

  deploy:
    name: Vercel'e deploy
    # Canlı teste bağlı değil: Passo GitHub sunucularını engellese bile deploy yapılabilsin
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Secret kontrolü
        if: env.VERCEL_TOKEN == ''
        run: echo "::notice::VERCEL_TOKEN tanımlı değil, deploy atlandı. README'deki adımlara bak."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
